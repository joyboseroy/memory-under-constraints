[project]
name = "memory-under-constraints"
version = "0.2.0"
description = "Controlled comparison of memory mechanisms under resource constraints and drift, with a remember-versus-recompute cost model"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joy Bose" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "matplotlib"]

[project.optional-dependencies]
neural = ["torch"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["muc*"]
